name: Build Modules
on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true
      patches_version:
        type: string
        required: false
        default: latest

  workflow_dispatch:
    inputs:
      patches_version:
        description: "morphe-patches release tag to build (latest or a tag like v2.3.0)"
        type: string
        required: false
        default: latest

env:
  VENDOR_ID: app.software.googletest1
  ICON_NAME: ic_custom_launcher
  MICROG_REPO: MorpheApp/MicroG-RE
  MICROG_REF: main
  PATCHES_REPO: MorpheApp/morphe-patches

jobs:
  microg:
    runs-on: ubuntu-latest
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Clone MicroG-RE
        run: git clone --depth 1 --branch "$MICROG_REF" "https://github.com/${MICROG_REPO}.git" microg

      - name: Rename package and launcher icon
        working-directory: microg
        run: |
          set -euo pipefail
          edit() {
            local file=$1; shift
            sed -i "$@" "$file"
            if git diff --quiet -- "$file"; then echo "::error::nothing changed in $file"; exit 1; fi
          }
          edit build.gradle "s/ext.basePackageName = \"app.revanced\"/ext.basePackageName = \"${VENDOR_ID}\"/"
          edit play-services-core/src/main/AndroidManifest.xml "s/android:name=\"app.revanced.android.gms.SPOOFED_PACKAGE_SIGNATURE\"/android:name=\"\${basePackageName}.android.gms.SPOOFED_PACKAGE_SIGNATURE\"/"
          edit play-services-core/src/main/res/xml/backup_rules.xml "s/app\.revanced\.android\.gms_preferences\.xml/${VENDOR_ID}.android.gms_preferences.xml/"
          edit play-services-core/src/main/res/xml/data_extraction_rules.xml "s/app\.revanced\.android\.gms_preferences\.xml/${VENDOR_ID}.android.gms_preferences.xml/"
          edit play-services-core/src/main/res/xml/credentials_provider_google_id.xml "s/app\.revanced\.android\.libraries/${VENDOR_ID}.android.libraries/"
          edit play-services-base/core/src/main/kotlin/org/microg/gms/utils/AppPatcherDetector.kt "s/^\(\s*\)\"app\.revanced\.android\.gms\",/\1\"app.revanced.android.gms\",\n\1\"${VENDOR_ID}.android.gms\",/"

          find play-services-core/src/main/res -name 'ic_launcher*' | while read -r f; do
            mv "$f" "$(dirname "$f")/$(basename "$f" | sed "s/^ic_launcher/${ICON_NAME}/")"
          done
          grep -rIl 'ic_launcher' . --exclude-dir=.git | xargs sed -i "s/ic_launcher/${ICON_NAME}/g"
          if grep -rIq 'ic_launcher' . --exclude-dir=.git; then echo "::error::ic_launcher references remain"; exit 1; fi
          test -f "play-services-core/src/main/res/mipmap-anydpi-v26/${ICON_NAME}.xml"
          git status --short | wc -l

      - name: Build
        working-directory: microg
        run: ./gradlew --no-daemon :play-services-core:assembleDefaultRelease

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_ENTRY_ALIAS: ${{ secrets.KEYSTORE_ENTRY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ENTRY_PASSWORD: ${{ secrets.KEYSTORE_ENTRY_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          UNSIGNED=$(ls microg/play-services-core/build/outputs/apk/default/release/*.apk | head -1)
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d >"$RUNNER_TEMP/microg.keystore"
            KS="$RUNNER_TEMP/microg.keystore" ALIAS="$KEYSTORE_ENTRY_ALIAS" KSPASS="$KEYSTORE_PASSWORD" KPASS="$KEYSTORE_ENTRY_PASSWORD"
          else
            KS="$GITHUB_WORKSPACE/ks.keystore" ALIAS=jhc KSPASS=123456789 KPASS=123456789
          fi
          mkdir -p dist
          OUT="dist/$(basename "$UNSIGNED" .apk | sed 's/-unsigned$//').apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ALIAS" --ks-pass "pass:$KSPASS" --key-pass "pass:$KPASS" --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: microg-apk
          path: dist/*.apk
          if-no-files-found: error

  run:
    needs: microg
    permissions: write-all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Update config
        if: ${{ inputs.from_ci }}
        run: |
          if git checkout origin/update build.md; then
            UPDATE_CFG=$(./build.sh config.toml --config-update)
            if [ "$UPDATE_CFG" ]; then
              echo "'$UPDATE_CFG'"
              echo "$UPDATE_CFG" > config.json
            fi
          fi

      - name: Get next version code
        id: next_ver_code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh release list -L 1 | awk -F '\t' '{print $3}')
          if [ -z "$TAG" ]; then TAG=0; fi
          echo "NEXT_VER_CODE=$((TAG + 1))" >> $GITHUB_OUTPUT

      - name: Build patches with the new GmsCore vendor id
        env:
          PATCHES_VERSION: ${{ inputs.patches_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GPR_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          TAG=${PATCHES_VERSION:-latest}
          if [ "$TAG" = "latest" ]; then TAG=$(gh api "repos/${PATCHES_REPO}/releases/latest" --jq .tag_name); fi
          echo "PATCHES_TAG=$TAG" >>"$GITHUB_ENV"
          SRC="$RUNNER_TEMP/morphe-patches"
          git clone --depth 1 --branch "$TAG" "https://github.com/${PATCHES_REPO}.git" "$SRC"
          cd "$SRC"
          edit() {
            local file=$1; shift
            sed -i "$@" "$file"
            if git diff --quiet -- "$file"; then echo "::error::nothing changed in $file"; exit 1; fi
          }
          edit extensions/shared-youtube/library/src/main/java/app/morphe/extension/shared/patches/GmsCoreSupportPatch.java "s/case \"app.revanced\" ->/case \"${VENDOR_ID}\" ->/; s/return \"app.revanced\";/return \"${VENDOR_ID}\";/"
          edit patches/src/main/kotlin/app/morphe/patches/shared/misc/gms/GmsCoreSupportPatch.kt "s/^internal const val GMS_CORE_VENDOR_GROUP_ID = \"app.revanced\"/internal const val GMS_CORE_VENDOR_GROUP_ID = \"${VENDOR_ID}\"/"
          ./gradlew :patches:buildAndroid --no-daemon --console=plain
          BUILT=$(find patches/build/libs -maxdepth 1 -name 'patches-*.mpp' ! -name '*sources*' ! -name '*javadoc*' | head -1)
          test -n "$BUILT"
          OWNER=${PATCHES_REPO%/*}
          DEST="$GITHUB_WORKSPACE/temp/${OWNER,,}-rv"
          mkdir -p "$DEST"
          cp "$BUILT" "$DEST/patches-${TAG#v}.mpp"

      - name: Build modules/APKs
        run: if [ -f "config.json" ]; then ./build.sh config.json; else ./build.sh config.toml; fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: $GITHUB_REPOSITORY
          NEXT_VER_CODE: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}

      - name: Add MicroG and patches info
        run: |
          echo "Patches: ${PATCHES_REPO}/patches-${PATCHES_TAG#v}.mpp  " >>build.md
          sed -i "s#\[Microg\](https://github.com/MorpheApp/MicroG-RE/)#[Microg](https://github.com/${GITHUB_REPOSITORY}/releases/latest)#" build.md

      - uses: actions/download-artifact@v4
        with:
          name: microg-apk
          path: build

      - name: Get output
        id: get_output
        run: |
          DELIM="$(openssl rand -hex 8)"
          echo "BUILD_LOG<<${DELIM}" >> "$GITHUB_OUTPUT"
          cat build.md >> "$GITHUB_OUTPUT"
          echo "${DELIM}" >> "$GITHUB_OUTPUT"
          cp -f build.md build.tmp
      
      - name: Upload release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
          BODY: ${{ steps.get_output.outputs.BUILD_LOG }}
        run: |
          ls -lh ./build/*
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Release" --notes "$BODY"
            gh release upload "$TAG" ./build/* --clobber
          else
            gh release create "$TAG" ./build/* --title "Release" --notes "$BODY"
          fi

      - name: Update modules changelog and update json
        id: update_config
        run: |
          git checkout -f update || git switch --discard-changes --orphan update
          cp -f build.tmp build.md
          get_update_json() {
            echo "{
            \"version\": \"$1\",
            \"versionCode\": ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }},
            \"zipUrl\": \"$2\",
            \"changelog\": \"https://raw.githubusercontent.com/$GITHUB_REPOSITORY/update/build.md\"
          }"
          }

          cd build || { echo "build folder not found"; exit 1; }
          for OUTPUT in *module*.zip; do
            [ "$OUTPUT" = "*module*.zip" ] && continue
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            if ! UPDATE_JSON=$(echo "$ZIP_S" | grep updateJson); then continue; fi
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(echo "$ZIP_S" | grep version=)
            VER="${VER##*=}"
            DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            get_update_json "$VER" "$DLURL" >"../$UPDATE_JSON"
          done
          cd ..

          find . -name "*-update.json" | grep . || : >dummy-update.json

      - name: Commit module json changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          git add build.md *-update.json
      
          if ! git diff --cached --quiet; then
            git commit -m "Bump version ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}"
            git push origin HEAD:update
          else
            echo "no changes!"
          fi

      - name: Report to Telegram
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        if: env.TG_TOKEN != null
        run: |
          cd build || { echo "build folder not found"; exit 1; }

          TG_CHAT="@rvc_magisk"
          NL=$'\n'
          APKS=""
          MODULES=""
          for OUTPUT in *; do
            DL_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}/${OUTPUT}"
            if [[ $OUTPUT = *.apk ]]; then
              APKS+="${NL}📦[${OUTPUT}](${DL_URL})"
            elif [[ $OUTPUT = *.zip ]]; then
              MODULES+="${NL}📦[${OUTPUT}](${DL_URL})"
            fi
          done
          if [ -n "$MODULES" ]; then
            MODULES="Modules:${NL}${MODULES#"$NL"}"
            if [ -n "$APKS" ]; then MODULES+=${NL}${NL}; fi
          fi
          if [ -n "$APKS" ]; then APKS="APKs:${NL}${APKS#"$NL"}"; fi

          BODY="$(cat ../build.md)"
          MSG="*New build!*

          ${BODY}

          *▼ Download Links:*
          ${MODULES}${APKS}
          "
          echo "'$MSG'"
          MSG=${MSG:0:9450}
          POST="https://api.telegram.org/bot${TG_TOKEN}/sendMessage"
          curl -X POST --data-urlencode "parse_mode=Markdown" --data-urlencode "disable_web_page_preview=true" --data-urlencode "text=${MSG}" --data-urlencode "chat_id=${TG_CHAT}" "$POST"
